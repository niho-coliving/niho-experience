name: api-client contract CI

on:
  pull_request:
    paths:
      - ".github/workflows/api-client-ci.yml"
      - "packages/api-client/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/api-client-ci.yml"
      - "packages/api-client/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/api-client/package-lock.json
      - run: npm -C packages/api-client ci
      - run: npm -C packages/api-client run check
