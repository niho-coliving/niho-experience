# A reviewed main SHA is built without credentials. Only the protected production
# environment can receive an image and create a candidate Cloud Run revision.
name: Deploy production candidate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Reviewed main commit SHA (40 hexadecimal characters)
        required: true
        type: string
      promote_traffic:
        description: Move traffic to the verified candidate (bookings and indexing stay off)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      IMAGE: web:${{ github.sha }}
      ARTIFACT_NAME: production-image-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      image_sha256: ${{ steps.image.outputs.sha256 }}
    steps:
      - name: Require the exact reviewed main SHA
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t "$IMAGE" .
      - name: Smoke test image
        run: sh scripts/container-smoke.sh "$IMAGE"
      - name: Save image artifact
        id: image
        run: |
          docker save --output image.tar "$IMAGE"
          echo "sha256=$(sha256sum image.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.candidate.outputs.url }}
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.PROD_GCP_PROJECT_ID }}
      REGION: ${{ vars.PROD_GCP_REGION }}
      REPOSITORY: ${{ vars.PROD_GCP_ARTIFACT_REPOSITORY }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.PROD_GCP_RUNTIME_SERVICE_ACCOUNT }}
      PREVIEW_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SERVICE: niho-experience
      ARTIFACT_NAME: production-image-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Require protected production settings
        run: |
          test -n "$PROJECT_ID"
          test -n "$REGION"
          test -n "$REPOSITORY"
          test -n "$RUNTIME_SERVICE_ACCOUNT"
          test "$PROJECT_ID" != "$PREVIEW_PROJECT_ID"
      # No checkout or repository scripts run after OIDC credentials are issued.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: .
      - name: Verify and load image artifact
        env:
          EXPECTED_IMAGE_SHA256: ${{ needs.build.outputs.image_sha256 }}
        run: |
          printf '%s  image.tar\n' "$EXPECTED_IMAGE_SHA256" | sha256sum --check --status
          docker load --input image.tar
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PROD_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PROD_GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Push image
        run: |
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/web:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker tag "web:${GITHUB_SHA}" "$image"
          docker push "$image"
      - name: Deploy candidate with sales and indexing disabled
        id: candidate
        run: |
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/web:${GITHUB_SHA}"
          tag="candidate-${GITHUB_SHA:0:12}"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --image "$image" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --no-invoker-iam-check --port 8080 --cpu 1 --memory 512Mi \
            --min-instances 0 --max-instances 2 --no-traffic --tag "$tag" \
            --set-env-vars 'EXPERIENCE_API_MODE=http,NEXT_PUBLIC_NIHO_WEB_ORIGIN=https://niho.life,SITE_URL=https://experience.niho.life,SITE_INDEXING=block,BOOKINGS_ENABLED=false,HOST_SIGNUP_MODE=pilot' \
            --labels "app=niho-experience,env=production,commit=${GITHUB_SHA:0:12}" --quiet
          state="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          revision="$(jq -r '.status.latestReadyRevisionName' <<< "$state")"
          url="$(jq -r --arg tag "$tag" '.status.traffic[] | select(.tag == $tag) | .url' <<< "$state")"
          test -n "$revision" && test -n "$url"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Check isolated candidate
        env:
          URL: ${{ steps.candidate.outputs.url }}
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          revision_json="$(gcloud run revisions describe "$REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          test "$(jq -r '.spec.containers[0].image' <<< "$revision_json")" = "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/web:${GITHUB_SHA}"
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "EXPERIENCE_API_MODE") | .value' <<< "$revision_json")" = http
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "BOOKINGS_ENABLED") | .value' <<< "$revision_json")" = false
          test "$(jq -r '.spec.containers[0].env[] | select(.name == "SITE_INDEXING") | .value' <<< "$revision_json")" = block
          for path in / /experiences /host; do
            curl -fsS -o /dev/null --retry 5 --retry-all-errors "${URL}${path}"
            echo "ok   ${path}"
          done
          page="$(curl -fsS "${URL}/experiences")"
          if grep -qF 'Preview with sample data' <<< "$page"; then exit 1; fi
          if grep -qF 'Details to be confirmed' <<< "$page"; then exit 1; fi
          curl -fsS "${URL}/robots.txt" | grep -qF 'Disallow: /'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "${URL}/preview/states")" = 404
          test "$(curl -sS -o /dev/null -w '%{http_code}' "${URL}/preview/checkout")" = 404
          echo "Candidate: ${REVISION} ${URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${GITHUB_SHA}; bookings=false; indexing=block; host signup=pilot" >> "$GITHUB_STEP_SUMMARY"
      - name: Promote verified candidate
        if: inputs.promote_traffic
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --to-revisions "${REVISION}=100" --quiet
          state="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          jq -e --arg revision "$REVISION" '[.status.traffic[] | select(.revisionName == $revision and .percent == 100)] | length == 1' <<< "$state" >/dev/null
          echo "Serving revision: ${REVISION} (100%)" >> "$GITHUB_STEP_SUMMARY"
